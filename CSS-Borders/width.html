<!DOCTYPE html>
<html>
    <head>
        <style>
        /*Width can be given in pixels or in words like 'medium' 'thick'*/
            p.one{border-style:solid;
            border-width:5px;}
            p.two{border-style:solid;
            border-width:thick;}
            /* We can set width size from all sides*/
            p.three{
            border-style: solid;
            border-width: 20px 5px; /* 20px top and bottom, 5px on the sides */}
            /*we can even specify all four sides*/
        </style>
    </head>
    <body>
        <h1>Border Width</h1>
        <p class="one">Hello Everyone</p>
        <p class="two">Hello Everyone</p>
        <p class="three">Hello Everyone</p>
    </body>
</html>
