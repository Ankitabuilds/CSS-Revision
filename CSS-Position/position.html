<!--The position property specifies the positioning type for an element.-->
<!DOCTYPE html>
<html>
    <head>
        <style>
            div.static{
                position:static;
                border:3px solid blue;
            }
            div.relative{
                position:relative;
                left:30px;
                border:3px solid pink;
            }
            /*It always stays in the same place even if the page is scrolled.*/
            div.fixed{
                position:fixed;
                bottom:0;
                right:0;
                width:50px;
                height:50px;
                border:3px solid black;
            }
        </style>
    </head>
    <body>
        <dic class="static">This is static positioning</dic>
        <div class="relative">This is relative positioning</div>
        <div class="fixed">This is fixed positioning</div>
    </body>
</html>
