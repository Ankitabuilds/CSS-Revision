<!--The position property specifies the positioning type for an element.-->
<!DOCTYPE html>
<html>
    <head>
        <style>
            div.static{
                position:static;
                border:3px solid blue;
            }
            div.relative{
                position:relative;
                left:30px;
                border:3px solid pink;
            }
        </style>
    </head>
    <body>
        <dic class="static">This is static positioning</dic>
        <div class="relative">This is relative positioning</div>
    </body>
</html>
