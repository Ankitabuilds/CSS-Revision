<!DOCTYPE html>
<html>
    <head>
        <style>
            p.first{
                margin:70px;
                border:1px solid black;
            }
            /*We can even give margins for individul sides*/
            p.second{
                margin-top:100px;
                margin-bottom:100px;
                margin-right:120px;
                margin-left:70px;
            }
            /*There also exists a shorthand for margin attribute
            p {
              margin: 25px 50px 75px 100px;
            }
            */
        </style>
    </head>
    <body>
        <h2>Margins</h2>
        <p class="first">Here is a margin</p>
        <pclass="second">This is alos a margin</p>
    </body>
</html>

<!--similarly we can use padding attribute-->
<!--padding-top,padding-bottom etc.-->
<!--Short hand can also be used padding:70px 65px 30px 30px;-->
